# Device/node priorities for desktop (XR18) vs laptop (Schiit Modi).
# toggle-laptop still sets defaults explicitly; these bias WirePlumber when
# devices appear/disappear.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.usb-BEHRINGER_X18_XR18.*" }
      { node.name = "~alsa_input.usb-BEHRINGER_X18_XR18.*" }
    ]
    actions = {
      update-props = {
        priority.driver  = 2000
        priority.session = 2000
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.usb-Schiit_Audio_USB_Modi.*" }
    ]
    actions = {
      update-props = {
        priority.driver  = 1500
        priority.session = 1500
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.pci-0000_00_1f.3.*" }
      { node.name = "~alsa_input.pci-0000_00_1f.3.*" }
    ]
    actions = {
      update-props = {
        priority.driver  = 1200
        priority.session = 1200
      }
    }
  }
  {
    matches = [
      { node.name = "xr18-aux" }
    ]
    actions = {
      update-props = {
        priority.driver  = 2500
        priority.session = 2500
      }
    }
  }
]
