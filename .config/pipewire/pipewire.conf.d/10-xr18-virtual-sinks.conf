# Virtual stereo sinks that mirror the old JACK Pulse Sink1 / Pulse Sink2 buses.
# Linked to XR18 playback AUX0-1 (Aux) and AUX2-3 (Ch15-16) via qpwgraph session.
context.objects = [
  {
    factory = adapter
    args = {
      factory.name     = support.null-audio-sink
      node.name        = "xr18-aux"
      node.description = "XR18 Aux"
      media.class      = "Audio/Sink"
      audio.position   = [ FL FR ]
      monitor.channel-volumes = false
    }
  }
  {
    factory = adapter
    args = {
      factory.name     = support.null-audio-sink
      node.name        = "xr18-ch15-16"
      node.description = "XR18 Ch15-16"
      media.class      = "Audio/Sink"
      audio.position   = [ FL FR ]
      monitor.channel-volumes = false
    }
  }
]
