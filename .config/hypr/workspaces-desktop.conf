# Workspace layout (desktop): left 1-3, center 4-7, right 8-10
# Monitor names match nwg-displays / monitors.conf
# DP-2=left, DP-1=center, DP-3=portrait

workspace = 1, monitor:DP-2, default:true
workspace = 2, monitor:DP-2
workspace = 3, monitor:DP-2

workspace = 4, monitor:DP-1, default:true
workspace = 5, monitor:DP-1
workspace = 6, monitor:DP-1
workspace = 7, monitor:DP-1

workspace = 8, monitor:DP-3, default:true
workspace = 9, monitor:DP-3
workspace = 10, monitor:DP-3
