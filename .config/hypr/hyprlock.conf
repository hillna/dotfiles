# Minimal lock screen for Hyprland (replaces xscreensaver lock)

$font = Monospace

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.7172
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0.6)
    outer_color = rgba(38, 139, 210, 0.8)
    check_color = rgba(133, 153, 0, 0.8)
    fail_color = rgba(220, 50, 47, 0.8)
    font_color = rgb(147, 161, 161)
    fade_on_empty = false
    rounding = 0
    font_family = $font
    placeholder_text = Password
    fail_text = $PAMFAIL
    dots_spacing = 0.2
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = $font
    color = rgba(147, 161, 161, 1.0)
    position = 0, 80
    halign = center
    valign = center
}
