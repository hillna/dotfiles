exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user start hyprpaper.service hyprpaper-watch.path
exec-once = systemctl --user start waybar-session.service
exec-once = systemctl --user start streamcontroller.service
exec-once = blueman-applet

# Desktop only: start JACK like bspwmrc
exec-once = bash -c 'if [ ! -e /tmp/laptop_mode ] && [ ! -f /etc/xps13 ] && ! pgrep -x jackdbus >/dev/null; then $HOME/.jack/start_jack.sh; fi'
exec-once = bash -c 'sleep 2; if [ ! -e /tmp/laptop_mode ] && [ ! -f /etc/xps13 ]; then pgrep -x qjackctl >/dev/null || qjackctl &; fi'
