# Hyprland config — modular layout matching bspwm workflow
# monitors.conf is generated by nwg-displays; configure displays there.

source = ~/.config/hypr/env.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/workspaces.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/windowrules.conf

general {
    gaps_in = 1
    gaps_out = 1
    border_size = 1
    col.active_border = rgba(268bd2ff)
    col.inactive_border = rgba(586e75aa)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 1.0
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}

animations {
    enabled = false
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

input {
    kb_layout = us
    kb_options = ctrl:nocaps
    follow_mouse = 0
    sensitivity = 0
    touchpad {
        natural_scroll = false
    }
}
