$mainMod = SUPER
$terminal = alacritty
$menu = rofi -modi drun,run -show drun -show-icons
$shotDir = $HOME/shots

# --- session / launcher ---
bind = $mainMod, RETURN, exec, alacritty -e tmux
bind = $mainMod SHIFT, RETURN, exec, alacritty
bind = $mainMod, R, exec, $menu
bind = $mainMod CTRL, R, exec, rofi -show run
bind = $mainMod SHIFT, R, exec, rofi -show window -show-icons
bind = $mainMod, E, exec, firefox
bind = $mainMod SHIFT, E, exec, firefox --private-window
bind = $mainMod ALT CTRL, ESCAPE, exit,
bind = $mainMod CTRL, Tab, exec, $HOME/.config/waybar/launch.sh

# --- window management ---
bind = $mainMod, W, killactive,
bind = $mainMod CTRL, W, exec, hyprctl dispatch killactive
bind = $mainMod, T, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, B, layoutmsg, equalize
bind = $mainMod, G, movewindow, mon:1

bind = $mainMod, comma, layoutmsg, orientationleft
bind = $mainMod, period, layoutmsg, orientationright

# --- focus / move (hjkl) ---
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# --- workspaces ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, bracketleft, workspace, e-1
bind = $mainMod, bracketright, workspace, e+1

# --- screenshots (grim + slurp; same modifiers as sxhkd) ---
# Capture window → file
bind = $mainMod SHIFT, F2, exec, grim -g "$(hyprctl activewindow -j | jq -r '"\(.at[0]),\(.at[1]) \(.size[0])x\(.size[1])"')" $shotDir/$(date +%Y-%m-%d-%H%M%S)_grim.png
# Copy window → clipboard
bind = $mainMod SHIFT CTRL, F2, exec, grim -g "$(hyprctl activewindow -j | jq -r '"\(.at[0]),\(.at[1]) \(.size[0])x\(.size[1])"')" - | wl-copy
# Capture all (full output) → file
bind = $mainMod SHIFT, F3, exec, grim $shotDir/$(date +%Y-%m-%d-%H%M%S)_grim.png
# Copy all → clipboard
bind = $mainMod SHIFT CTRL, F3, exec, grim - | wl-copy
# Capture selection (slurp region) → file
bind = $mainMod SHIFT, F4, exec, grim -g "$(slurp)" $shotDir/$(date +%Y-%m-%d-%H%M%S)_grim.png
# Copy selection → clipboard
bind = $mainMod SHIFT CTRL, F4, exec, grim -g "$(slurp)" - | wl-copy

# --- mouse ---
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# --- media keys ---
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindl = , XF86AudioPrev, exec, mpc -q prev
bindl = , XF86AudioNext, exec, mpc -q next
